set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore the last saved environment when tmux server starts.
set -g @continuum-restore 'on'
# Auto-save every 15 minutes (default).
set -g @continuum-save-interval '15'
# Restore running programs in panes, not just the layout.
set -g @resurrect-capture-pane-contents 'on'
# Capture only the visible screen, not the full 50k-line scrollback, so old
# terminal output is not archived to disk every 15 minutes.
set -g @resurrect-pane-contents-area 'visible'

set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_current_text " #{window_name}"

# Show the current pane's working directory ($PWD) instead of the pane title.
set -g status-right '#{pane_current_path} %H:%M %d-%b-%y'

bind ";" command-prompt -p "Pane title:" "select-pane -T '%%'"
bind '"' split-window -vb -c "#{pane_current_path}"
bind '%' split-window -hb -c "#{pane_current_path}"

# <prefix> P: pick a pass(1) entry in a popup and paste it into this pane.
# display-popup does not expand formats in its command, so stash the target
# pane in an option first -- set -F does expand it.
bind P set -gF @pass-target "#{pane_id}" \; \
    display-popup -E -w 70% -h 60% -T " pass " "~/.config/tmux/pass-to-pane.sh"

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g allow-rename off

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g escape-time 0
set -g extended-keys on

run '~/.tmux/plugins/tpm/tpm'
